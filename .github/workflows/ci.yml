name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # One job: format, lint, build, typecheck, test — one small vitest project, no
  # containers, no per-engine sharding (unlike outputty/laygo's own two-job split).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Style gate first — cheap, fails fast before the build.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:run
